name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      required_client_vars: ${{ steps.deploy-config.outputs.required_client_vars }}
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the replay classification
        run: bash scripts/replay-ci.sh --self-test

      - name: Check deploy config
        id: deploy-config
        run: |
          bun scripts/check-deploy-config.ts
          echo "required_client_vars=$(bun scripts/check-deploy-config.ts --required-client-vars | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Audit dependencies
        run: bun run audit

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Check the rule table
        run: bun scripts/check-rule-table.ts

      - name: Check the lint budget
        run: bun scripts/lint-budget.ts

      - name: Check dependencies and dead exports
        run: bun scripts/knip-budget.ts

      - name: Check types
        run: bunx turbo run check-types

      # A service container cannot take MinIO's `server` command, so this step starts it.
      - name: Start MinIO for pictures:reconcile
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=test -e MINIO_ROOT_PASSWORD=test-password \
            cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a server /data
          timeout 60 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
          docker run --rm --network host -e MC_HOST_s3=http://test:test-password@localhost:9000 \
            cgr.dev/chainguard/minio-client@sha256:2fc4412391f1ce7372db8dd8bee17b38d76f7bb898bac195915bfe6979aa5784 mb s3/myakiba-test

      - name: Test
        run: bun run test
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
          TEST_REDIS_URL: redis://localhost:6379
          TEST_S3_URL: http://test:test-password@localhost:9000/myakiba-test

  extension-sources:
    name: Rebuild the extension from its sources zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # apps/extension/SOURCE_CODE_REVIEW.md tells AMO's reviewers to build with Node 24.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Zip the extension
        working-directory: apps/extension
        run: bun run zip

      - name: Check the manifests ask for what STORE.md lists
        working-directory: apps/extension
        run: bun run check-manifest

      - name: Rebuild from the sources zip and compare
        working-directory: apps/extension
        run: bun run verify-sources

  build-images:
    name: Build ${{ matrix.image }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: apps/server/Dockerfile
            build_args: |
              SOURCE_COMMIT=${{ github.sha }}
              VITE_SERVER_URL=http://vite-server-url.image-smoke.invalid
              VITE_TURNSTILE_SITE_KEY=vite-turnstile-site-key-image-smoke
            smoke: db-push=myakiba-db-push:ci server=myakiba-server:ci
          - image: db-push
            dockerfile: packages/db/Dockerfile
            build_args: ""
            smoke: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          pull: true
          load: ${{ matrix.smoke != '' }}
          tags: myakiba-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build db-push image for the server smoke
        if: matrix.image == 'server'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/db/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          load: true
          tags: myakiba-db-push:ci
          cache-from: type=gha,scope=db-push

      - name: Smoke-test images
        if: matrix.smoke != ''
        env:
          SMOKE_REQUIRED_CLIENT_VARS: ${{ needs.validate.outputs.required_client_vars }}
        run: bash scripts/image-smoke.sh ${{ matrix.smoke }}

      - name: Smoke-test the server image with Redis unreachable
        if: matrix.image == 'server'
        env:
          SMOKE_REQUIRED_CLIENT_VARS: ${{ needs.validate.outputs.required_client_vars }}
        run: bash scripts/image-smoke.sh --redis unreachable server=myakiba-server:ci

      - name: Smoke-test the server image with Postgres unreachable
        if: matrix.image == 'server'
        env:
          SMOKE_REQUIRED_CLIENT_VARS: ${{ needs.validate.outputs.required_client_vars }}
        run: bash scripts/image-smoke.sh --postgres unreachable server=myakiba-server:ci
