name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      required_client_vars: ${{ steps.deploy-config.outputs.required_client_vars }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check deploy config
        id: deploy-config
        run: |
          bun scripts/check-deploy-config.ts
          echo "required_client_vars=$(bun scripts/check-deploy-config.ts --required-client-vars | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Audit dependencies
        run: bun run audit

      - name: Check formatting and lint
        run: bun run check

      - name: Check types
        run: bunx turbo run check-types

  build-images:
    name: Build ${{ matrix.image }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: apps/server/Dockerfile
            build_args: |
              SOURCE_COMMIT=${{ github.sha }}
              VITE_SERVER_URL=http://vite-server-url.image-smoke.invalid
              VITE_TURNSTILE_SITE_KEY=vite-turnstile-site-key-image-smoke
            smoke: db-push=myakiba-db-push:ci server=myakiba-server:ci
          - image: worker
            dockerfile: apps/worker/Dockerfile
            build_args: ""
            smoke: ""
          - image: db-push
            dockerfile: packages/db/Dockerfile
            build_args: ""
            smoke: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          pull: true
          load: ${{ matrix.smoke != '' }}
          tags: myakiba-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build db-push image for the server smoke
        if: matrix.image == 'server'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/db/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          load: true
          tags: myakiba-db-push:ci
          cache-from: type=gha,scope=db-push

      - name: Smoke-test images
        if: matrix.smoke != ''
        env:
          SMOKE_REQUIRED_CLIENT_VARS: ${{ needs.validate.outputs.required_client_vars }}
        run: bash scripts/image-smoke.sh ${{ matrix.smoke }}
