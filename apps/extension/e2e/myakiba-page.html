<!doctype html>
<title>mock myakiba</title>
<h1>mock myakiba</h1>
<script>
  const CHANNEL = "myakiba-mfc-bridge";
  const runs = new Map();
  const seen = [];

  window.addEventListener("message", (event) => {
    if (event.source !== window || event.origin !== location.origin) return;
    const message = event.data;
    if (message?.channel !== CHANNEL || !message.event) return;
    seen.push(message);
    runs.get(message.requestId)?.(message.event);
  });

  function send(request) {
    const requestId = crypto.randomUUID();
    window.postMessage({ channel: CHANNEL, protocol: 2, requestId, request }, location.origin);
    return requestId;
  }

  async function sha256(buffer) {
    const digest = await crypto.subtle.digest("SHA-256", buffer);
    return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
  }

  const events = new Map();

  window.bridge = {
    statuses: [],
    start(mfcItemIds) {
      const requestId = send({ type: "fetch-items", mfcItemIds });
      events.set(requestId, []);
      runs.set(requestId, (event) => events.get(requestId).push(event));
      return requestId;
    },
    cancel(targetRequestId) {
      send({ type: "cancel", targetRequestId });
    },
    events: (requestId) => events.get(requestId) ?? [],
    announces: () => seen.filter((message) => message.event.type === "announce").length,
    async hello(timeoutMs) {
      for (const deadline = performance.now() + timeoutMs; performance.now() < deadline;) {
        const requestId = send({ type: "hello" });
        await new Promise((resolve) => setTimeout(resolve, 100));
        const answer = seen.find((message) => message.requestId === requestId);
        if (answer) return answer.event;
      }
      return null;
    },
    fetchItems(mfcItemIds) {
      return new Promise((resolve) => {
        const items = [];
        // Each item's picture hashes before the run resolves, however long the browser's digest takes.
        let read = Promise.resolve();
        const requestId = send({ type: "fetch-items", mfcItemIds });
        runs.set(requestId, (event) => {
          if (event.type === "status") window.bridge.statuses.push(event);
          if (event.type === "item")
            read = read.then(async () => {
              const { result } = event;
              const ok = result.status === "ok";
              const picture = ok ? result.value.picture : null;
              items.push({
                mfcItemId: event.mfcItemId,
                ok,
                error: ok ? null : result.error.code,
                html: ok ? result.value.html : null,
                picture: picture && {
                  isArrayBuffer: picture.bytes instanceof ArrayBuffer,
                  byteLength: picture.bytes.byteLength,
                  contentType: picture.contentType,
                  sha256: await sha256(picture.bytes),
                },
              });
            });
          if (event.type === "done") read.then(() => resolve({ items, reason: event.reason }));
        });
      });
    },
    takePicks() {
      return new Promise((resolve) => {
        const requestId = send({ type: "take-picks" });
        runs.set(requestId, (event) => {
          if (event.type !== "picks") return;
          resolve(
            event.picks.map((pick) => ({
              captureId: pick.captureId,
              mfcItemId: pick.mfcItemId,
              title: pick.title,
              html: pick.html,
              pictureBytes: pick.picture && pick.picture.bytes.byteLength,
            })),
          );
        });
      });
    },
    picksSaved(captureIds) {
      return new Promise((resolve) => {
        const requestId = send({ type: "picks-saved", captureIds });
        runs.set(requestId, (event) => {
          if (event.type === "done") resolve(event.reason);
        });
      });
    },
    async rogue(waitMs) {
      const requestId = crypto.randomUUID();
      window.postMessage(
        {
          channel: CHANNEL,
          protocol: 2,
          requestId,
          request: { type: "fetch-url", url: "http://127.0.0.1:4601/item/98777" },
        },
        location.origin,
      );
      await new Promise((resolve) => setTimeout(resolve, waitMs));
      return seen.filter((message) => message.requestId === requestId).length;
    },
  };
</script>
